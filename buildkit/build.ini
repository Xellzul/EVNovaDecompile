; EV Nova build kit: where the tools and the game copies are, inside the image.
;
; The image build (Dockerfile) unpacks all of them from your folder of original downloads (README.md) into
; /opt/evnova, one folder per product, the way each installer lays its files down. Nothing of it is in the
; repository or ever written into it. A relative path is relative to the repository root (/repo).
; `python buildkit/build.py check` verifies the compilers, libraries and game copies by size, CRC32 and SHA-256
; and that the header, licence and framework folders exist (buildlib/toolchain.py).

[paths]
; where the builds go (one folder per target)
out = buildkit/out
; the targets whose inputs the image build had (unpack/unpack.py writes it)
targets = /opt/evnova/targets.txt

[win]
; CodeWarrior for Windows 9.2 with its 9.3 update: mwcc, mwld, mwwinrc 3.2.4 build 418, FlexLM 8 (Bin/lmgr8c.dll),
; MSL; license.dat is your CodeWarrior 9 licence file
codewarrior = /opt/evnova/cw-win-9.2-with-9.3-update
; CodeWarrior for Symbian Personal 2.0: mwccsym2 2.4.7 build 335, the compiler of zlib, libpng and REGGIE
symbian = /opt/evnova/cw-symbian-2.0-personal
; CodeWarrior for Symbian OS 3.0: only its Symbian_Support/MSL folder (the 2001 MSL headers libpng was built against)
symbian3 = /opt/evnova/cw-symbian-3.0
; the folder holding FlexLM 3.26's lmgr326b.dll, which mwccsym2 loads
flexlm326 = /opt/evnova/cw-symbian-2.0-personal/bin
; Apple's QuickTime 6 SDK for Windows: the folder holding qtmlClient.lib, the exe's own QTML client library
quicktime = /opt/evnova/apple-quicktime-6-sdk
; the licence file for mwcc, mwld, mwwinrc and mwccsym2 (its FEATURE lines Win32_Plugins_Win32_...)
license = /opt/evnova/cw-win-9.2-with-9.3-update/license.dat
; how many files to compile at once
jobs = 4

[mac1010]
; MW C/C++ PPC 2.4.1 build 0160, the Mac compiler plugin of the CodeWarrior Pro 6.2 update: its two forks as files
; ("MW C++ PPC", "MW C++ PPC.rsrc") and the Pro 6.3 disc's license.dat. The game is compiled with it.
plugin_b0160 = /opt/evnova/cw-mac-pro6.2-plugin
; MW C/C++ PPC 2.4.6 build 222, the plugin of the CodeWarrior Pro 7.1 update, laid out the same way. The libraries.
plugin_b222 = /opt/evnova/cw-mac-pro7.1-plugin
; MWLinkPPC.exe of CodeWarrior Pro 6 for Windows (the Windows-hosted Mac PPC linker); keep no lmgr326b.dll beside it
mwlinkppc = /opt/evnova/cw-mac-pro6/Other Metrowerks Tools/Command Line Tools/MWLinkPPC.exe
; that install's licence (FEATURE Win32_Plugins_MacOS_... 6.0, which MWLinkPPC checks) and its FlexLM 3.26 DLL
license = /opt/evnova/cw-mac-pro6/license.dat
flexlm326 = /opt/evnova/cw-mac-pro6/Bin
; CodeWarrior Pro 6.3's MSL and MacOS Support folders: Universal Interfaces, MSL C and runtime libraries
pro63 = /opt/evnova/cw-mac-pro6.3
; CodeWarrior Pro 6 for Windows: the stub libraries (with their RESOURCE.FRK folder), Open Transport's PPC Debug Libraries
pro6 = /opt/evnova/cw-mac-pro6
; Apple's Internet Config 2.0.2 Programmer's Kit and CarbonLib 1.4 GM SDK: each one's stub library as
; MacOS Support/Universal/Libraries/StubLibraries/<name>, its resource fork in RESOURCE.FRK/<name> beside it
ic_sdk = /opt/evnova/apple-ic-sdk-2.0.2
carbonlib_sdk = /opt/evnova/apple-carbonlib-sdk-1.4
; how many emulated compiles at once (each needs about 300 MB)
jobs = 2

[mac111]
; The install root of Apple gcc_40-5494 (i686/ and powerpc/, each bin/ and bin-objc/), cctools-port 877.8 (cctools/),
; ld64-97.17 (ld64/ld) and darwin_qsort.so (lib/), built from source by the Dockerfile (applegcc/).
; Built here, so another build of the same source may differ in bytes; `check` reports that, the output decides.
applegcc = /opt/applegcc
; Mac OS X 10.4u SDK, from your Xcode 3.2.6 dmg (applegcc/extract_sdk.sh)
sdk = /opt/applegcc/sdk/MacOSX10.4u.sdk
; the rest of that Xcode extract (its gcc4.0 package holds libgcc and crt1.o's companions)
xcode = /opt/applegcc/xcode326
; AmbrosiaTools, ASWDebug and ShortcutRecorder from your EV Nova 1.1.1 dmg (EV Nova.app/Contents/Frameworks);
; copied again before the link, never changed in place
frameworks = /opt/evnova/game/mac-1.1.1/Frameworks
; a Linux (ext4) folder for the work files and the precompiled header. The link also writes the paths the original
; link saw, because the debug map records them: /Users/jerome/Ambrosia/... and /Developer (symlinks)
workdir = /var/tmp/evnova-buildkit
; how many files to compile at once
jobs = 4

[game]
; EV Nova 1.0.10 for Windows: the folder holding EV Nova.exe (read for its icons and its signature)
win1010 = /opt/evnova/game/win-1.0.10
; EV Nova 1.0.10 for Mac OS: "EV Nova" (the data fork) and ".rsrc/EV Nova" (its resource fork as a file).
; RezLib and FATCarbon are cut from it.
mac1010 = /opt/evnova/game/mac-1.0.10
; EV Nova 1.1.1 for Mac OS X: EV Nova.app/Contents/MacOS/EV Nova (read for its debug names and its signature)
mac111 = /opt/evnova/game/mac-1.1.1/MacOS/EV Nova
